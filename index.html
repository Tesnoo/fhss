<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-width=1.0">
  <title>FHSP - Seeding & Ranking</title>
  <style>
    /* 🎨 カラーテーマ */
    :root {
      --primary-color: #FA8534;
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-main: #ffffff;
      --text-muted: #aaaaaa;
      --border-color: #333333;
      --transition-speed: 0.3s;
    }

    [data-theme="light"] {
      --bg-color: #f5f7fa;
      --card-bg: #ffffff;
      --text-main: #1a1a1a;
      --text-muted: #666666;
      --border-color: #e1e4e8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      transition: background-color var(--transition-speed), color var(--transition-speed);
      overflow-x: hidden;
    }

    /* ✨ オープニングトランジション画面 */
    #intro-screen {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100vh;
      background-color: #0a0a0a; /* ロゴが映えるダーク背景 */
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .intro-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      perspective: 1000px; /* 羽ばたきの3D表現用 */
    }

    /* 🪽 羽のアニメーション */
    .intro-wing {
      width: 120px;
      transform-origin: bottom left; /* 羽の根元を軸に動かす */
      animation: wingFlyAway 2.6s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }
    
    /* 📝 実際の画像ファイルを使う場合はこちらを有効化してください */
    /*
    .intro-wing {
      background-image: url('wing.png');
      background-size: contain;
      background-repeat: no-repeat;
      height: 120px;
    }
    */

    @keyframes wingFlyAway {
      0%   { transform: scale(1) rotate(0deg); opacity: 0; }
      10%  { transform: scale(1) rotate(0deg); opacity: 1; }
      
      /* 羽ばたき 1回目 (Y軸で回転させて立体的にパタッとさせる) */
      30%  { transform: rotateY(65deg) rotateZ(-5deg); }
      40%  { transform: rotateY(0deg) rotateZ(0deg); }
      
      /* 羽ばたき 2回目 */
      55%  { transform: rotateY(65deg) rotateZ(-10deg); }
      65%  { transform: rotateY(0deg) rotateZ(0deg); }
      
      /* 画面右上へ飛び立つ */
      80%  { transform: rotateY(45deg) translate(150vw, -150vh) scale(0.8); opacity: 1; }
      100% { transform: rotateY(45deg) translate(150vw, -150vh) scale(0.8); opacity: 0; }
    }

    /* ✒️ 文字のアニメーション */
    .intro-text {
      font-size: 4rem;
      font-weight: 300;
      font-style: italic;
      color: #ffffff;
      letter-spacing: 0.02em;
      animation: textSlideInOut 2.6s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    /* 📝 実際の画像ファイルを使う場合はこちらを有効化してください */
    /*
    .intro-text {
      content: url('text.png');
      height: 60px;
    }
    */

    @keyframes textSlideInOut {
      0%   { transform: translateX(-100vw); opacity: 0; }
      15%  { transform: translateX(0); opacity: 1; } /* 左からスライドイン */
      65%  { transform: translateX(0); opacity: 1; } /* 中央で待機 */
      85%  { transform: translateX(100vw); opacity: 0; } /* 羽と一緒に右へ退場 */
      100% { transform: translateX(100vw); opacity: 0; }
    }

    .intro-hidden {
      opacity: 0 !important;
      visibility: hidden !important;
    }

    /* 📱 ヘッダーとメインコンテンツ（前回と同じ） */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      transition: background-color var(--transition-speed);
    }
    .header-title { font-size: 1.5rem; font-weight: 900; }
    .header-title span { color: var(--primary-color); }
    .theme-toggle-btn { background: none; border: 1px solid var(--border-color); color: var(--text-main); padding: 0.5rem 1rem; border-radius: 20px; cursor: pointer; font-size: 0.9rem; font-weight: bold; transition: all 0.2s; }
    .theme-toggle-btn:hover { border-color: var(--primary-color); color: var(--primary-color); }
    main { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }
    .search-bar { display: flex; gap: 10px; margin-bottom: 2rem; }
    .search-bar input { flex: 1; padding: 1rem; border-radius: 8px; border: 1px solid var(--border-color); background-color: var(--card-bg); color: var(--text-main); font-size: 1rem; outline: none; transition: border-color 0.2s; }
    .search-bar input:focus { border-color: var(--primary-color); }
    .ranking-card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 1.5rem; margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center; transition: transform 0.2s, box-shadow 0.2s; }
    .ranking-card:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(250, 133, 52, 0.15); border-color: var(--primary-color); }
    .rank-info { display: flex; align-items: center; gap: 15px; }
    .rank-num { font-size: 1.5rem; font-weight: bold; color: var(--text-muted); width: 40px; }
    .rank-name { font-size: 1.2rem; font-weight: bold; }
    .rank-score { font-size: 1.5rem; font-weight: 900; color: var(--primary-color); }
    @media (max-width: 600px) { header { padding: 1rem; } .search-bar { flex-direction: column; } }
  </style>
</head>
<body>

  <!-- 🎬 オープニングトランジション画面 -->
  <div id="intro-screen">
    <div class="intro-container">
      
      <!-- 羽の部分 (画像に差し替えるまでのダミーSVG) -->
      <div class="intro-wing">
        <svg viewBox="0 0 100 100" width="100%" height="100%">
          <path d="M10,90 Q15,40 90,10 Q60,30 50,75 Z" fill="#FA8534"/>
          <path d="M35,75 Q45,45 80,35 Q65,45 50,70 Z" fill="#e0d4cc"/>
        </svg>
      </div>
      
      <!-- 文字の部分 -->
      <div class="intro-text">Fly High!!</div>
      
    </div>
  </div>

  <!-- 🏷 ヘッダー -->
  <header>
    <div class="header-title"><span>F</span>HSP</div>
    <button class="theme-toggle-btn" id="theme-btn">☀️ Light Mode</button>
  </header>

  <!-- 📄 メインコンテンツ -->
  <main>
    <div class="search-bar">
      <input type="text" placeholder="プレイヤー名で検索 (例: てすぬー)">
    </div>
    <div style="margin-bottom: 1rem; color: var(--text-muted); font-size: 0.9rem;">
      TOKYO / SEEDING RANKING
    </div>
    <div class="ranking-card">
      <div class="rank-info"><div class="rank-num">1</div><div class="rank-name">Player A</div></div>
      <div class="rank-score">12,450</div>
    </div>
    <div class="ranking-card">
      <div class="rank-info"><div class="rank-num">2</div><div class="rank-name">Player B</div></div>
      <div class="rank-score">10,800</div>
    </div>
  </main>

  <script>
    // 1. オープニング終了後に画面を消す
    window.addEventListener('load', () => {
      const introScreen = document.getElementById('intro-screen');
      // アニメーション完了時間（2.6秒）に合わせてフェードアウトを開始
      setTimeout(() => {
        introScreen.classList.add('intro-hidden');
      }, 2500); 
    });

    // 2. テーマ切り替え
    const themeBtn = document.getElementById('theme-btn');
    const htmlEl = document.documentElement;

    themeBtn.addEventListener('click', () => {
      const currentTheme = htmlEl.getAttribute('data-theme');
      if (currentTheme === 'dark') {
        htmlEl.setAttribute('data-theme', 'light');
        themeBtn.textContent = '🌙 Dark Mode';
      } else {
        htmlEl.setAttribute('data-theme', 'dark');
        themeBtn.textContent = '☀️ Light Mode';
      }
    });
  </script>
</body>
</html>
