<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-width=1.0">
  <title>FHSS｜Fly High!! Seeding System</title>
  
  <link rel="icon" href="Flyhigh_logo.png" type="image/png">
  
  <script>
    function getThemeCookie() {
      const match = document.cookie.match(new RegExp('(^| )fhsp_theme=([^;]+)'));
      return match ? match[2] : 'dark';
    }
    document.documentElement.setAttribute('data-theme', getThemeCookie());
  </script>
  <style>
    /* 🎨 カラーテーマ */
    :root {
      --primary-color: #FA8534;
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-main: #ffffff;
      --text-muted: #aaaaaa;
      --border-color: #333333;
      --intro-text-img: url('flyhigh_text_white.png'); 
    }

    [data-theme="light"] {
      --bg-color: #f5f7fa;
      --card-bg: #ffffff;
      --text-main: #1a1a1a;
      --text-muted: #666666;
      --border-color: #e1e4e8;
      --intro-text-img: url('flyhigh_text_black.png'); 
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      overflow-x: hidden;
    }

    /* 🔘 トグルスイッチ */
    .theme-switch { position: relative; display: inline-block; width: 54px; height: 28px; flex-shrink: 0; }
    .theme-switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: #333; border-radius: 34px; border: 1px solid #555;
    }
    .slider:before {
      position: absolute; content: "🌙"; font-size: 14px; display: flex; justify-content: center;
      align-items: center; height: 22px; width: 22px; left: 2px; bottom: 2px;
      background-color: #1e1e1e; transition: transform 0.2s; border-radius: 50%;
    }
    input:checked + .slider { background-color: #e1e4e8; border-color: #ccc; }
    input:checked + .slider:before { transform: translateX(26px); content: "☀️"; background-color: #ffffff; }

    /* ✨ オープニング画面 */
    #intro-screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
      background-color: var(--bg-color); display: flex; justify-content: center;
      align-items: center; z-index: 9999; transition: opacity 0.5s ease, visibility 0.5s ease;
    }
    .intro-container { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 0; perspective: 1000px; }
    
    /* 🪽 ロゴ（羽） */
    .intro-wing {
      width: 250px; height: 250px; background-image: url('Flyhigh_logo.png');
      background-size: contain; background-repeat: no-repeat; background-position: bottom center; 
      transform-origin: center; 
      /* 📌 ロード中は無限に揺れ続ける */
      animation: floatWing 1.5s ease-in-out infinite alternate; 
    }
    @keyframes floatWing { 0% { transform: translateY(0) rotate(0deg); } 100% { transform: translateY(-5px) rotate(2deg); } }
    
    /* ✒️ 文字 */
    .intro-text {
      width: 320px; height: 160px; background-position: center center; background-image: var(--intro-text-img);
      background-size: 100% auto; background-repeat: no-repeat; margin-top: -45px; 
      /* 📌 左からスライドインして、定位置で待機 */
      animation: textSlideIn 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards; 
    }
    @keyframes textSlideIn { 0% { transform: translateX(-50vw); opacity: 0; } 100% { transform: translateX(0); opacity: 1; } }

    /* ⏳ ローディングテキスト (Now Loading...) */
    .loading-text {
      color: var(--text-muted); font-size: 1rem; font-weight: bold; letter-spacing: 0.1em;
      margin-top: -20px; display: flex; align-items: flex-end; gap: 2px;
      transition: opacity 0.4s ease;
    }
    .loading-dots { display: inline-flex; }
    /* 📌 3点リーダーが波打つように跳ねる */
    .loading-dots span { animation: loadingBounce 1.4s infinite ease-in-out both; }
    .loading-dots span:nth-child(1) { animation-delay: -0.32s; }
    .loading-dots span:nth-child(2) { animation-delay: -0.16s; }
    @keyframes loadingBounce {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-6px); }
    }

    /* 🚀 【データ取得完了時】付与されるクラスによる変化 */
    .fly-away .intro-wing {
      /* 羽ばたいて飛んでいく */
      animation: wingFlyAway 1s cubic-bezier(0.55, 0.085, 0.68, 0.53) forwards; 
    }
    .fly-away .intro-text {
      /* 右へスライドアウト */
      animation: textSlideOut 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards; 
    }
    .fly-away .loading-text {
      /* ロード文字はスッと消える */
      opacity: 0; 
    }
    @keyframes wingFlyAway { 0% { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 1; } 20% { transform: translate(10px, 10px) scale(0.9) rotate(-10deg); opacity: 1; } 100% { transform: translate(-100vw, -100vh) scale(0.5) rotate(45deg); opacity: 0; } }
    @keyframes textSlideOut { 0% { transform: translateX(0); opacity: 1; } 100% { transform: translateX(100vw); opacity: 0; } }

    .intro-hidden { opacity: 0 !important; visibility: hidden !important; pointer-events: none; }

    /* 📱 ヘッダー */
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 1rem 2rem; background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color); height: 75px; 
    }
    .header-left { display: flex; align-items: center; gap: 15px; }
    .header-logo { width: 45px; height: 45px; object-fit: contain; }
    .header-title-container { display: flex; flex-direction: column; justify-content: center; line-height: 1.1; }
    .header-title-main { font-size: 1.8rem; font-weight: 900; letter-spacing: 0.05em; }
    .header-title-main span.highlight { color: var(--primary-color); }
    .header-title-sub { font-size: 0.85rem; color: var(--text-muted); letter-spacing: 0.03em; }
    .header-right { display: flex; align-items: center; gap: 15px; }
    
    .btn-settings {
      background-color: var(--card-bg); color: var(--text-main); border: 1px solid var(--border-color);
      padding: 0.5rem 1rem; border-radius: 8px; font-size: 0.9rem; font-weight: bold;
      cursor: pointer; display: flex; align-items: center; gap: 5px;
    }
    .btn-settings:hover { border-color: var(--primary-color); color: var(--primary-color); }

    /* 📄 メインコンテンツ領域 */
    main { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }
    .search-bar { display: flex; gap: 10px; margin-bottom: 2rem; }
    .search-bar input { 
      flex: 1; padding: 1rem; border-radius: 8px; border: 1px solid var(--border-color); 
      background-color: var(--card-bg); color: var(--text-main); font-size: 1rem; outline: none; 
    }
    .search-bar input:focus { border-color: var(--primary-color); }
    
    .player-count-header { margin-bottom: 1rem; color: var(--text-muted); font-size: 0.9rem; display: flex; justify-content: flex-end; font-weight: bold; }
    
    /* 🏆 ランキングカード */
    .ranking-card {
      background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px;
      padding: 1.2rem 1.5rem; margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center;
    }
    .ranking-card:hover { border-color: var(--primary-color); }
    
    .rank-info { display: flex; flex-direction: column; gap: 2px; flex: 1; }
    .rank-num { font-size: 1rem; font-weight: bold; color: var(--primary-color); }
    .rank-name { font-size: 1.4rem; font-weight: 900; word-break: break-all; }
    
    .rank-score-area { text-align: right; }
    .rank-score { font-size: 1.8rem; font-weight: 900; color: var(--text-main); line-height: 1; }
    .rank-score-label { font-size: 0.7rem; color: var(--text-muted); font-weight: bold; margin-top: 4px; letter-spacing: 0.05em; }
    
    /* 📄 ページネーション */
    .pagination-controls { display: flex; justify-content: center; align-items: center; gap: 15px; margin: 2rem 0; }
    .btn-page { background-color: var(--card-bg); color: var(--text-main); border: 1px solid var(--border-color); padding: 0.6rem 1.5rem; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .btn-page:hover:not(:disabled) { border-color: var(--primary-color); color: var(--primary-color); }
    .btn-page:disabled { opacity: 0.4; cursor: not-allowed; }
    .page-info { font-weight: bold; color: var(--text-main); font-size: 1.1rem; }

    .hidden { display: none !important; }
    .no-results { text-align: center; padding: 3rem; color: var(--text-muted); font-weight: bold; }

    /* 📱 スマホ画面での最適化 */
    @media (max-width: 600px) { 
      header { padding: 0.8rem 1rem; } 
      .header-logo { width: 35px; height: 35px; }
      .header-left { gap: 10px; }
      .header-right { gap: 10px; }
      .header-title-main { font-size: 1.5rem; }
      .header-title-sub { font-size: 0.65rem; }
      .btn-text { display: none; }
      .btn-settings { padding: 0.5rem; }
      
      .search-bar { flex-direction: column; margin-bottom: 1.5rem; } 
      .intro-wing { width: 180px; height: 180px; } 
      .intro-text { width: 240px; height: 120px; margin-top: -35px; }
      .loading-text { font-size: 0.85rem; margin-top: -15px; }
      
      .ranking-card { padding: 1rem; }
      .rank-name { font-size: 1.2rem; }
      .rank-score { font-size: 1.4rem; }
      .btn-page { padding: 0.5rem 1rem; }
    }
  </style>
</head>
<body>

  <!-- ✨ オープニング -->
  <div id="intro-screen">
    <div class="intro-container">
      <div class="intro-wing"></div>
      <div class="intro-text"></div>
      <!-- ⏳ 追加：ローディングアニメーション文字 -->
      <div class="loading-text">
        Now Loading
        <div class="loading-dots"><span>.</span><span>.</span><span>.</span></div>
      </div>
    </div>
  </div>

  <!-- 🏷 ヘッダー -->
  <header>
    <div class="header-left">
      <img src="Flyhigh_logo.png" alt="Logo" class="header-logo">
      <div class="header-title-container">
        <div class="header-title-main"><span class="highlight">F</span>HSS</div>
        <div class="header-title-sub">Fly High!! Seeding System</div>
      </div>
    </div>
    
    <div class="header-right">
      <button id="btn-open-settings" class="btn-settings">⚙️ <span class="btn-text">シード設定</span></button>
      <label class="theme-switch">
        <input type="checkbox" id="theme-toggle">
        <span class="slider"></span>
      </label>
    </div>
  </header>

  <!-- 📄 ランキング画面 -->
  <main id="view-ranking">
    <div class="search-bar">
      <input type="text" id="search-input" placeholder="🔎｜start.gg登録名 または Discriminator で検索">
    </div>
    
    <div class="player-count-header">
      <span id="player-count">0 Players</span>
    </div>
    
    <div id="ranking-list"></div>
    
    <div id="pagination-controls" class="pagination-controls"></div>
  </main>

  <!-- ⚙️ シード設定画面 -->
  <main id="view-settings" class="hidden">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
      <h2>シード設定</h2>
      <button id="btn-close-settings" class="btn-settings" style="padding: 0.5rem 1rem;">
        ◀ <span class="btn-text" style="display: inline;">ランキングに戻る</span>
      </button>
    </div>
    <div class="ranking-card" style="flex-direction: column; align-items: flex-start; gap: 15px;">
      <h3 style="color: var(--primary-color);">認証および設定システム (準備中)</h3>
      <div style="width: 100%; height: 150px; border: 2px dashed var(--border-color); display: flex; justify-content: center; align-items: center; border-radius: 8px; color: var(--border-color); font-weight: bold;">
        System Building...
      </div>
    </div>
  </main>

  <script>
    // --- 🎨 テーマ切り替えロジック ---
    const themeToggle = document.getElementById('theme-toggle');
    const htmlEl = document.documentElement;
    if (htmlEl.getAttribute('data-theme') === 'light') themeToggle.checked = true;

    function setThemeCookie(themeName) {
      const d = new Date(); d.setTime(d.getTime() + (30 * 24 * 60 * 60 * 1000));
      document.cookie = "fhsp_theme=" + themeName + ";expires=" + d.toUTCString() + ";path=/";
    }

    themeToggle.addEventListener('change', (e) => {
      const newTheme = e.target.checked ? 'light' : 'dark';
      htmlEl.setAttribute('data-theme', newTheme);
      setThemeCookie(newTheme);
    });

    // --- 🔀 画面切り替え ---
    document.getElementById('btn-open-settings').addEventListener('click', () => {
      document.getElementById('view-ranking').classList.add('hidden');
      document.getElementById('view-settings').classList.remove('hidden');
    });
    document.getElementById('btn-close-settings').addEventListener('click', () => {
      document.getElementById('view-settings').classList.add('hidden');
      document.getElementById('view-ranking').classList.remove('hidden');
    });

    // =========================================================================
    // 📊 データレンダリング・検索・ページネーション
    // =========================================================================
    
    const API_URL = "https://script.google.com/macros/s/AKfycby9WYK7CP3dUE8E9bdppk35w-k96ahekGS1oDmKIzoHDZnHq9kyLdKtnS7kQZoigQBB/exec";
    
    const rankingList = document.getElementById('ranking-list');
    const searchInput = document.getElementById('search-input');
    const playerCount = document.getElementById('player-count');
    const paginationControls = document.getElementById('pagination-controls');
    
    let allPlayerData = [];
    let filteredData = [];
    let currentPage = 1;
    const ITEMS_PER_PAGE = 30;

    function renderPage(page) {
      rankingList.innerHTML = ""; 
      const startIndex = (page - 1) * ITEMS_PER_PAGE;
      const endIndex = startIndex + ITEMS_PER_PAGE;
      const paginatedItems = filteredData.slice(startIndex, endIndex);

      if (paginatedItems.length === 0) {
        rankingList.innerHTML = `<div class="no-results">該当するプレイヤーが見つかりません。</div>`;
        paginationControls.innerHTML = "";
        return;
      }

      paginatedItems.forEach(p => {
        const cardHTML = `
          <div class="ranking-card">
            <div class="rank-info">
              <div class="rank-num">Rank ${p.rank}</div>
              <div class="rank-name">${p.tag}</div>
            </div>
            <div class="rank-score-area">
              <div class="rank-score">${Math.floor(p.score).toLocaleString()}</div>
              <div class="rank-score-label">FHSP</div>
            </div>
          </div>
        `;
        rankingList.insertAdjacentHTML('beforeend', cardHTML);
      });
      renderPaginationControls();
    }

    function renderPaginationControls() {
      const totalPages = Math.ceil(filteredData.length / ITEMS_PER_PAGE);
      if (totalPages <= 1) { paginationControls.innerHTML = ""; return; }

      const prevDisabled = currentPage === 1 ? "disabled" : "";
      const nextDisabled = currentPage === totalPages ? "disabled" : "";

      paginationControls.innerHTML = `
        <button class="btn-page" ${prevDisabled} onclick="changePage(${currentPage - 1})">◀ 前へ</button>
        <div class="page-info">${currentPage} / ${totalPages}</div>
        <button class="btn-page" ${nextDisabled} onclick="changePage(${currentPage + 1})">次へ ▶</button>
      `;
    }

    window.changePage = function(newPage) {
      currentPage = newPage;
      renderPage(currentPage);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    searchInput.addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase().trim();
      filteredData = allPlayerData.filter(p => p.tag.toLowerCase().includes(query));
      currentPage = 1;
      playerCount.textContent = `${filteredData.length} Players`;
      renderPage(currentPage);
    });

    // 🚀 アニメーションとAPI通信の同期システム
    window.addEventListener('DOMContentLoaded', async () => {
      const introScreen = document.getElementById('intro-screen');
      
      // ① 通信が爆速で終わった場合でも、オープニングを最低1.5秒は魅せるためのタイマー
      const minDelay = new Promise(resolve => setTimeout(resolve, 1500));
      
      // ② データフェッチ処理
      const fetchData = fetch(API_URL)
        .then(res => res.json())
        .then(data => {
          if (data.error) throw new Error(data.error);
          allPlayerData = data;
          filteredData = data;
        })
        .catch(err => {
          console.error(err);
          // 失敗した場合はエラー表示
          rankingList.innerHTML = `<div class="no-results" style="color: #f87171;">エラー: データの取得に失敗しました。<br>通信環境を確認してください。</div>`;
        });

      // ③ アニメーション確保時間 と データ取得 の両方が完了するまで待機
      await Promise.all([minDelay, fetchData]);
      
      // ④ 準備完了の合図（.fly-away クラスを付与）→ 羽ばたきアニメーションが発火
      introScreen.classList.add('fly-away');
      
      // ⑤ 飛翔アニメーションの長さ（約1秒）を待ってから、ローディング画面を消去＆リスト描画
      setTimeout(() => {
        introScreen.classList.add('intro-hidden');
        if (allPlayerData.length > 0) {
          playerCount.textContent = `${allPlayerData.length} Players`;
          renderPage(1);
        }
      }, 1000); 
    });
  </script>
</body>
</html>
