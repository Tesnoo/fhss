<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-width=1.0">
  <title>FHSS｜Fly High!! Seeding System</title>
  
  <link rel="icon" href="Flyhigh_logo.png" type="image/png">
  
  <script>
    function getThemeCookie() {
      const match = document.cookie.match(new RegExp('(^| )fhsp_theme=([^;]+)'));
      return match ? match[2] : 'dark';
    }
    document.documentElement.setAttribute('data-theme', getThemeCookie());
  </script>
  <style>
    /* 🎨 カラーテーマ */
    :root {
      --primary-color: #FA8534;
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-main: #ffffff;
      --text-muted: #aaaaaa;
      --border-color: #333333;
      --transition-speed: 0.3s;
      --intro-text-img: url('flyhigh_text_white.png'); 
    }

    [data-theme="light"] {
      --bg-color: #f5f7fa;
      --card-bg: #ffffff;
      --text-main: #1a1a1a;
      --text-muted: #666666;
      --border-color: #e1e4e8;
      --intro-text-img: url('flyhigh_text_black.png'); 
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      transition: background-color var(--transition-speed), color var(--transition-speed);
      overflow-x: hidden;
    }

    /* 🔘 トグルスイッチ */
    .theme-switch { position: relative; display: inline-block; width: 54px; height: 28px; flex-shrink: 0; }
    .theme-switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: #333; transition: .3s; border-radius: 34px; border: 1px solid #555;
    }
    .slider:before {
      position: absolute; content: "🌙"; font-size: 14px; display: flex; justify-content: center;
      align-items: center; height: 22px; width: 22px; left: 2px; bottom: 2px;
      background-color: #1e1e1e; transition: .3s; border-radius: 50%;
    }
    input:checked + .slider { background-color: #e1e4e8; border-color: #ccc; }
    input:checked + .slider:before { transform: translateX(26px); content: "☀️"; background-color: #ffffff; }

    /* ✨ オープニング */
    #intro-screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
      background-color: var(--bg-color); display: flex; justify-content: center;
      align-items: center; z-index: 9999; transition: opacity 0.8s ease, visibility 0.8s ease;
    }
    .intro-container { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 0; perspective: 1000px; }
    .intro-wing {
      width: 250px; height: 250px; background-image: url('Flyhigh_logo.png');
      background-size: contain; background-repeat: no-repeat; background-position: bottom center; 
      transform-origin: center; animation: floatWing 1.5s ease-in-out infinite alternate, wingFlyAway 1s cubic-bezier(0.55, 0.085, 0.68, 0.53) 1.5s forwards;
    }
    @keyframes floatWing { 0% { transform: translateY(0) rotate(0deg); } 100% { transform: translateY(-5px) rotate(2deg); } }
    @keyframes wingFlyAway { 0% { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 1; } 20% { transform: translate(10px, 10px) scale(0.9) rotate(-10deg); opacity: 1; } 100% { transform: translate(-100vw, -100vh) scale(0.5) rotate(45deg); opacity: 0; } }
    .intro-text {
      width: 320px; height: 160px; background-position: center center; background-image: var(--intro-text-img);
      background-size: 100% auto; background-repeat: no-repeat; margin-top: -45px; 
      animation: textSlideInOut 2.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }
    @keyframes textSlideInOut { 0% { transform: translateX(-50vw); opacity: 0; } 20% { transform: translateX(0); opacity: 1; } 60% { transform: translateX(0); opacity: 1; } 100% { transform: translateX(100vw); opacity: 0; } }
    .intro-hidden { opacity: 0 !important; visibility: hidden !important; pointer-events: none; }

    /* 📱 ヘッダー */
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 1rem 2rem; background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color); height: 75px; 
    }
    .header-left { display: flex; align-items: center; gap: 15px; }
    .header-logo { width: 45px; height: 45px; object-fit: contain; }
    .header-title-container { display: flex; flex-direction: column; justify-content: center; line-height: 1.1; }
    .header-title-main { font-size: 1.8rem; font-weight: 900; letter-spacing: 0.05em; }
    .header-title-main span.highlight { color: var(--primary-color); }
    .header-title-sub { font-size: 0.85rem; color: var(--text-muted); letter-spacing: 0.03em; }
    .header-right { display: flex; align-items: center; gap: 15px; }
    
    .btn-settings {
      background-color: var(--card-bg); color: var(--text-main); border: 1px solid var(--border-color);
      padding: 0.5rem 1rem; border-radius: 8px; font-size: 0.9rem; font-weight: bold;
      cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 5px;
    }
    .btn-settings:hover { border-color: var(--primary-color); color: var(--primary-color); }

    /* 📄 メインコンテンツ領域 */
    main { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }
    .search-bar { display: flex; gap: 10px; margin-bottom: 2rem; }
    .search-bar input { flex: 1; padding: 1rem; border-radius: 8px; border: 1px solid var(--border-color); background-color: var(--card-bg); color: var(--text-main); font-size: 1rem; outline: none; transition: border-color 0.2s; }
    .search-bar input:focus { border-color: var(--primary-color); }
    
    /* 🏆 ランキングカードの拡張 */
    .ranking-card {
      background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px;
      padding: 1.2rem 1.5rem; margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .ranking-card:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(250, 133, 52, 0.15); border-color: var(--primary-color); }
    
    .rank-info { display: flex; align-items: center; gap: 20px; flex: 1; }
    .rank-num { font-size: 1.8rem; font-weight: 900; color: var(--text-muted); width: 45px; text-align: center; }
    
    .rank-details { display: flex; flex-direction: column; gap: 4px; }
    .rank-name { font-size: 1.3rem; font-weight: bold; }
    
    .rank-stats { display: flex; gap: 15px; font-size: 0.85rem; color: var(--text-muted); font-weight: bold; }
    .stat-positive { color: #4ade80; } 
    .stat-negative { color: #f87171; } 
    
    .rank-score-area { text-align: right; }
    .rank-score { font-size: 1.8rem; font-weight: 900; color: var(--primary-color); line-height: 1; }
    .rank-score-label { font-size: 0.7rem; color: var(--text-muted); font-weight: bold; margin-top: 4px; letter-spacing: 0.05em; }
    
    .hidden { display: none !important; }
    .no-results { text-align: center; padding: 3rem; color: var(--text-muted); font-weight: bold; }

    /* 📱 スマホ画面での最適化 */
    @media (max-width: 600px) { 
      header { padding: 0.8rem 1rem; } 
      .header-logo { width: 35px; height: 35px; }
      .header-left { gap: 10px; }
      .header-right { gap: 10px; }
      .header-title-main { font-size: 1.5rem; }
      .header-title-sub { font-size: 0.65rem; }
      .btn-text { display: none; }
      .btn-settings { padding: 0.5rem; }
      
      .search-bar { flex-direction: column; margin-bottom: 1.5rem; } 
      .intro-wing { width: 180px; height: 180px; } 
      .intro-text { width: 240px; height: 120px; margin-top: -35px; }
      
      .ranking-card { padding: 1rem; }
      .rank-info { gap: 12px; }
      .rank-num { font-size: 1.5rem; width: 30px; }
      .rank-name { font-size: 1.1rem; }
      .rank-stats { flex-direction: column; gap: 2px; font-size: 0.75rem; }
      .rank-score { font-size: 1.4rem; }
    }
  </style>
</head>
<body>

  <div id="intro-screen">
    <div class="intro-container">
      <div class="intro-wing"></div>
      <div class="intro-text"></div>
    </div>
  </div>

  <header>
    <div class="header-left">
      <img src="Flyhigh_logo.png" alt="Logo" class="header-logo">
      <div class="header-title-container">
        <div class="header-title-main"><span class="highlight">F</span>HSS</div>
        <div class="header-title-sub">Fly High!! Seeding System</div>
      </div>
    </div>
    
    <div class="header-right">
      <button id="btn-open-settings" class="btn-settings">⚙️ <span class="btn-text">シード設定</span></button>
      <label class="theme-switch">
        <input type="checkbox" id="theme-toggle">
        <span class="slider"></span>
      </label>
    </div>
  </header>

  <main id="view-ranking">
    <div class="search-bar">
      <input type="text" id="search-input" placeholder="プレイヤー名で検索 (例: てすぬー)">
    </div>
    <div style="margin-bottom: 1rem; color: var(--text-muted); font-size: 0.9rem; display: flex; justify-content: space-between;">
      <span>TOKYO / SEEDING RANKING</span>
      <span id="player-count">0 Players</span>
    </div>
    
    <div id="ranking-list"></div>
  </main>

  <main id="view-settings" class="hidden">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
      <h2>シード設定</h2>
      <button id="btn-close-settings" class="btn-settings" style="padding: 0.5rem 1rem;">
        ◀ <span class="btn-text" style="display: inline;">ランキングに戻る</span>
      </button>
    </div>
    
    <div class="ranking-card" style="flex-direction: column; align-items: flex-start; gap: 15px;">
      <h3 style="color: var(--primary-color);">認証および設定システム (準備中)</h3>
      <p style="color: var(--text-muted); line-height: 1.6;">
        今後のアップデートにて、MTPRと同等の認証ロジックと<br>大会シード作成用のパラメータ調整UIを実装予定です。
      </p>
      
      <div style="width: 100%; height: 150px; border: 2px dashed var(--border-color); display: flex; justify-content: center; align-items: center; border-radius: 8px; color: var(--border-color); font-weight: bold;">
        System Building...
      </div>
    </div>
  </main>

  <script>
    const themeToggle = document.getElementById('theme-toggle');
    const htmlEl = document.documentElement;
    if (htmlEl.getAttribute('data-theme') === 'light') themeToggle.checked = true;

    function setThemeCookie(themeName) {
      const d = new Date(); d.setTime(d.getTime() + (30 * 24 * 60 * 60 * 1000));
      document.cookie = "fhsp_theme=" + themeName + ";expires=" + d.toUTCString() + ";path=/";
    }

    themeToggle.addEventListener('change', (e) => {
      const newTheme = e.target.checked ? 'light' : 'dark';
      htmlEl.setAttribute('data-theme', newTheme);
      setThemeCookie(newTheme);
    });

    window.addEventListener('load', () => {
      const introScreen = document.getElementById('intro-screen');
      setTimeout(() => { introScreen.classList.add('intro-hidden'); }, 2500); 
    });

    document.getElementById('btn-open-settings').addEventListener('click', () => {
      document.getElementById('view-ranking').classList.add('hidden');
      document.getElementById('view-settings').classList.remove('hidden');
    });
    document.getElementById('btn-close-settings').addEventListener('click', () => {
      document.getElementById('view-settings').classList.add('hidden');
      document.getElementById('view-ranking').classList.remove('hidden');
    });

    // =========================================================================
    // 📊 データレンダリング・検索システム
    // =========================================================================
    
    // ユーザー提供のAPI URL
    const API_URL = "https://script.google.com/macros/s/AKfycby9WYK7CP3dUE8E9bdppk35w-k96ahekGS1oDmKIzoHDZnHq9kyLdKtnS7kQZoigQBB/exec";
    
    const rankingList = document.getElementById('ranking-list');
    const searchInput = document.getElementById('search-input');
    const playerCount = document.getElementById('player-count');
    
    let allPlayerData = [];

    function renderPlayers(players) {
      rankingList.innerHTML = ""; 
      playerCount.textContent = `${players.length} Players`;

      if (players.length === 0) {
        rankingList.innerHTML = `<div class="no-results">該当するプレイヤーが見つかりません。</div>`;
        return;
      }

      players.forEach(p => {
        const winRateDisplay = (p.winRate * 100).toFixed(1) + "%";
        
        let sprDisplay = "";
        let sprClass = "";
        if (p.avgSpr > 0) {
          sprDisplay = "+" + p.avgSpr;
          sprClass = "stat-positive";
        } else if (p.avgSpr < 0) {
          sprDisplay = p.avgSpr;
          sprClass = "stat-negative";
        } else {
          sprDisplay = "±0";
        }

        const cardHTML = `
          <div class="ranking-card">
            <div class="rank-info">
              <div class="rank-num">${p.rank}</div>
              <div class="rank-details">
                <div class="rank-name">${p.tag}</div>
                <div class="rank-stats">
                  <span>勝率: ${winRateDisplay}</span>
                  <span>Avg.SPR: <span class="${sprClass}">${sprDisplay}</span></span>
                </div>
              </div>
            </div>
            <div class="rank-score-area">
              <div class="rank-score">${Math.floor(p.score).toLocaleString()}</div>
              <div class="rank-score-label">FHSP</div>
            </div>
          </div>
        `;
        rankingList.insertAdjacentHTML('beforeend', cardHTML);
      });
    }

    async function loadRankingData() {
      rankingList.innerHTML = `<div class="no-results">最新のデータベースと同期中... ⏳</div>`;
      try {
        const response = await fetch(API_URL);
        const data = await response.json();
        
        if (data.error) {
          rankingList.innerHTML = `<div class="no-results" style="color: #f87171;">エラー: ${data.error}</div>`;
          return;
        }
        
        allPlayerData = data;
        renderPlayers(allPlayerData);
        
      } catch (error) {
        rankingList.innerHTML = `<div class="no-results" style="color: #f87171;">データの取得に失敗しました。<br>通信環境を確認するか、GASのデプロイ設定(アクセスできるユーザー: 全員)を確認してください。</div>`;
        console.error("Fetch error:", error);
      }
    }

    searchInput.addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase().trim();
      const filtered = allPlayerData.filter(p => p.tag.toLowerCase().includes(query));
      renderPlayers(filtered);
    });

    window.addEventListener('DOMContentLoaded', loadRankingData);
  </script>
</body>
</html>
