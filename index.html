<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-width=1.0">
  <title>FHSP - Seeding & Ranking</title>
  <style>
    /* 🎨 カラーテーマ（CSS変数） */
    :root {
      --primary-color: #FA8534; /* メインのオレンジ */
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-main: #ffffff;
      --text-muted: #aaaaaa;
      --border-color: #333333;
      --transition-speed: 0.3s;
    }

    [data-theme="light"] {
      --bg-color: #f5f7fa;
      --card-bg: #ffffff;
      --text-main: #1a1a1a;
      --text-muted: #666666;
      --border-color: #e1e4e8;
    }

    /* 🔧 全体リセットとベース設定 */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      transition: background-color var(--transition-speed), color var(--transition-speed);
      overflow-x: hidden;
    }

    /* ✨ オープニングトランジション（ローディング画面） */
    #intro-screen {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100vh;
      background-color: #0a0a0a; /* ここは常にダークな色にしてカッコよく */
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }
    .intro-logo {
      font-size: 3rem;
      font-weight: bold;
      color: #fff;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      animation: pulse 1.5s infinite alternate;
    }
    .intro-logo span { color: var(--primary-color); }
    
    @keyframes pulse {
      0% { transform: scale(1); text-shadow: 0 0 10px rgba(250, 133, 52, 0.2); }
      100% { transform: scale(1.05); text-shadow: 0 0 25px rgba(250, 133, 52, 0.8); }
    }

    /* 読み込み完了後に付与するクラスで画面を消す */
    .intro-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* 📱 ヘッダー */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      transition: background-color var(--transition-speed);
    }
    .header-title {
      font-size: 1.5rem;
      font-weight: 900;
    }
    .header-title span { color: var(--primary-color); }
    
    .theme-toggle-btn {
      background: none;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.5rem 1rem;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: bold;
      transition: all 0.2s;
    }
    .theme-toggle-btn:hover { border-color: var(--primary-color); color: var(--primary-color); }

    /* 🖥 メインコンテンツエリア */
    main { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }
    
    /* 検索バー風のUI */
    .search-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 2rem;
    }
    .search-bar input {
      flex: 1;
      padding: 1rem;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: var(--card-bg);
      color: var(--text-main);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-bar input:focus { border-color: var(--primary-color); }

    /* ランキング表のダミー枠 */
    .ranking-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .ranking-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(250, 133, 52, 0.15);
      border-color: var(--primary-color);
    }
    .rank-info { display: flex; align-items: center; gap: 15px; }
    .rank-num { font-size: 1.5rem; font-weight: bold; color: var(--text-muted); width: 40px; }
    .rank-name { font-size: 1.2rem; font-weight: bold; }
    .rank-score { font-size: 1.5rem; font-weight: 900; color: var(--primary-color); }

    /* スマホ向け調整 */
    @media (max-width: 600px) {
      header { padding: 1rem; }
      .search-bar { flex-direction: column; }
    }
  </style>
</head>
<body>

  <!-- 🎬 オープニングトランジション画面 -->
  <div id="intro-screen">
    <div class="intro-logo"><span>F</span>HSP</div>
  </div>

  <!-- 🏷 ヘッダー -->
  <header>
    <div class="header-title"><span>F</span>HSP</div>
    <button class="theme-toggle-btn" id="theme-btn">☀️ Light Mode</button>
  </header>

  <!-- 📄 メインコンテンツ -->
  <main>
    <div class="search-bar">
      <input type="text" placeholder="プレイヤー名で検索 (例: てすぬー)">
    </div>

    <!-- ランキングのダミーデータ表示 -->
    <div style="margin-bottom: 1rem; color: var(--text-muted); font-size: 0.9rem;">
      TOKYO / SEEDING RANKING
    </div>

    <div class="ranking-card">
      <div class="rank-info">
        <div class="rank-num">1</div>
        <div class="rank-name">Player A</div>
      </div>
      <div class="rank-score">12,450</div>
    </div>

    <div class="ranking-card">
      <div class="rank-info">
        <div class="rank-num">2</div>
        <div class="rank-name">Player B</div>
      </div>
      <div class="rank-score">10,800</div>
    </div>
  </main>

  <script>
    // 1. オープニングトランジションの処理
    window.addEventListener('load', () => {
      const introScreen = document.getElementById('intro-screen');
      // 実際はAPI通信が終わったタイミングで消しますが、今回は1.2秒後に自動でフェードアウトさせます
      setTimeout(() => {
        introScreen.classList.add('intro-hidden');
      }, 1200);
    });

    // 2. ダークモード/ライトモードの切り替え処理
    const themeBtn = document.getElementById('theme-btn');
    const htmlEl = document.documentElement;

    themeBtn.addEventListener('click', () => {
      const currentTheme = htmlEl.getAttribute('data-theme');
      if (currentTheme === 'dark') {
        htmlEl.setAttribute('data-theme', 'light');
        themeBtn.textContent = '🌙 Dark Mode';
      } else {
        htmlEl.setAttribute('data-theme', 'dark');
        themeBtn.textContent = '☀️ Light Mode';
      }
    });
  </script>
</body>
</html>
