<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-width=1.0">
  <title>FHSP - Seeding & Ranking</title>
  <style>
    /* 🎨 カラーテーマ */
    :root {
      --primary-color: #FA8534;
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-main: #ffffff;
      --text-muted: #aaaaaa;
      --border-color: #333333;
      --transition-speed: 0.3s;
      
      /* アニメーション用の変数 */
      --intro-text-img: url('flyhigh_text_white.png'); /* ダークモード時の文字画像 */
    }

    [data-theme="light"] {
      --bg-color: #f5f7fa;
      --card-bg: #ffffff;
      --text-main: #1a1a1a;
      --text-muted: #666666;
      --border-color: #e1e4e8;
      
      --intro-text-img: url('flyhigh_text_black.png'); /* ライトモード時の文字画像 */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      transition: background-color var(--transition-speed), color var(--transition-speed);
      overflow-x: hidden;
    }

    /* ✨ オープニングトランジション画面 */
    #intro-screen {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100vh;
      background-color: var(--bg-color);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    /* 羽と文字を縦並びに配置するためのコンテナ */
    .intro-container {
      display: flex;
      flex-direction: column; /* ここを column に変更して縦並びに */
      justify-content: center;
      align-items: center;
      gap: 30px; /* 羽と文字の隙間 */
      perspective: 1000px;
    }

    /* 🪽 羽のアニメーション */
    .intro-wing {
      width: 250px;  /* 150pxから大幅拡大 */
      height: 250px; /* 150pxから大幅拡大 */
      background-image: url('Flyhigh_logo.png');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      transform-origin: center;
      
      animation: 
        floatWing 1.5s ease-in-out infinite alternate,
        wingFlyAway 1s cubic-bezier(0.55, 0.085, 0.68, 0.53) 1.5s forwards;
    }
    
    @keyframes floatWing {
      0%   { transform: translateY(0) rotate(0deg); }
      100% { transform: translateY(-5px) rotate(2deg); }
    }

    @keyframes wingFlyAway {
      0%   { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 1; }
      20%  { transform: translate(10px, 10px) scale(0.9) rotate(-10deg); opacity: 1; }
      100% { transform: translate(-100vw, -100vh) scale(0.5) rotate(45deg); opacity: 0; }
    }

    /* ✒️ 文字のアニメーション */
    .intro-text {
      width: 500px;  /* 300pxから大幅拡大 */
      height: 150px; /* 100pxから拡大 */
      background-image: var(--intro-text-img);
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center center; /* 中央揃えに変更 */
      
      animation: textSlideInOut 2.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    @keyframes textSlideInOut {
      0%   { transform: translateX(-50vw); opacity: 0; }
      20%  { transform: translateX(0); opacity: 1; }
      60%  { transform: translateX(0); opacity: 1; }
      100% { transform: translateX(100vw); opacity: 0; }
    }

    .intro-hidden {
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none;
    }

    /* 📱 ヘッダーとメインコンテンツ */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      transition: background-color var(--transition-speed);
    }
    .header-title { font-size: 1.5rem; font-weight: 900; }
    .header-title span { color: var(--primary-color); }
    
    .theme-toggle-btn { background: none; border: 1px solid var(--border-color); color: var(--text-main); padding: 0.5rem 1rem; border-radius: 20px; cursor: pointer; font-size: 0.9rem; font-weight: bold; transition: all 0.2s; }
    .theme-toggle-btn:hover { border-color: var(--primary-color); color: var(--primary-color); }
    
    main { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }
    .search-bar { display: flex; gap: 10px; margin-bottom: 2rem; }
    .search-bar input { flex: 1; padding: 1rem; border-radius: 8px; border: 1px solid var(--border-color); background-color: var(--card-bg); color: var(--text-main); font-size: 1rem; outline: none; transition: border-color 0.2s; }
    .search-bar input:focus { border-color: var(--primary-color); }
    
    .ranking-card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 1.5rem; margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center; transition: transform 0.2s, box-shadow 0.2s; }
    .ranking-card:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(250, 133, 52, 0.15); border-color: var(--primary-color); }
    .rank-info { display: flex; align-items: center; gap: 15px; }
    .rank-num { font-size: 1.5rem; font-weight: bold; color: var(--text-muted); width: 40px; }
    .rank-name { font-size: 1.2rem; font-weight: bold; }
    .rank-score { font-size: 1.5rem; font-weight: 900; color: var(--primary-color); }
    
    /* スマホ画面でのサイズ調整 */
    @media (max-width: 600px) { 
      header { padding: 1rem; } 
      .search-bar { flex-direction: column; } 
      .intro-wing { width: 180px; height: 180px; } /* スマホ用ロゴサイズ */
      .intro-text { width: 300px; height: 90px; }  /* スマホ用文字サイズ */
    }
  </style>
</head>
<body>

  <div id="intro-screen">
    <div class="intro-container">
      <div class="intro-wing"></div>
      <div class="intro-text"></div>
    </div>
  </div>

  <header>
    <div class="header-title"><span>F</span>HSP</div>
    <button class="theme-toggle-btn" id="theme-btn">☀️ Light Mode</button>
  </header>

  <main>
    <div class="search-bar">
      <input type="text" placeholder="プレイヤー名で検索 (例: てすぬー)">
    </div>
    <div style="margin-bottom: 1rem; color: var(--text-muted); font-size: 0.9rem;">
      TOKYO / SEEDING RANKING
    </div>
    <div class="ranking-card">
      <div class="rank-info"><div class="rank-num">1</div><div class="rank-name">Player A</div></div>
      <div class="rank-score">12,450</div>
    </div>
    <div class="ranking-card">
      <div class="rank-info"><div class="rank-num">2</div><div class="rank-name">Player B</div></div>
      <div class="rank-score">10,800</div>
    </div>
  </main>

  <script>
    window.addEventListener('load', () => {
      const introScreen = document.getElementById('intro-screen');
      setTimeout(() => {
        introScreen.classList.add('intro-hidden');
      }, 2500); 
    });

    const themeBtn = document.getElementById('theme-btn');
    const htmlEl = document.documentElement;

    themeBtn.addEventListener('click', () => {
      const currentTheme = htmlEl.getAttribute('data-theme');
      if (currentTheme === 'dark') {
        htmlEl.setAttribute('data-theme', 'light');
        themeBtn.textContent = '🌙 Dark Mode';
      } else {
        htmlEl.setAttribute('data-theme', 'dark');
        themeBtn.textContent = '☀️ Light Mode';
      }
    });
  </script>
</body>
</html>
